name: mymoneyclone
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.3
  iconsax_flutter: ^1.0.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  flutter_sticky_header: ^0.8.0
  flex_menu_button: ^1.0.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  stylish_bottom_bar: ^1.1.1
  flutter_svg: ^2.0.9
  contained_tab_bar_view: ^0.8.0
  percent_indicator: ^4.2.5
  to_csv: ^6.0.1
  animated_text_kit: ^4.3.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

  adaptive_icon_background: "#ffffff"

flutter:
  uses-material-design: true

  assets:
    - assets/images/svg_bg_rings.svg
    - assets/images/png_bg_rings.png
    - assets/icon/icon.png